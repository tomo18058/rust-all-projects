<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rust vs JS クイズ</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- テーマ -->
    <div id="theme-select" class="container">
        <h2>テーマを選んでください</h2>
        <button onclick="selectTheme('rust')">Rustテーマ</button>
        <button onclick="selectTheme('js')">JavaScriptテーマ</button>
        <div id="confirm-area" style="display: none; margin-top: 1rem;">
        <p>このテーマでよろしいですか？</p>
        <button onclick="confirmTheme()">OK</button>
        </div>
    </div>
    
    <div class="container" id="quiz-container" style="display: none;">
        <h1>このコードはRust？JavaScript？</h1>
        <pre id="code-block">println!("Hello,world!");</pre>

        <div class="options">
            <button onclick="checkAnswer('Rust')">Rust</button>
            <button onclick="checkAnswer('JavaScript')">JavaScript</button>
        </div>

        <p id="result"></p>
        <div class="status">
            <span id="question-couunt">1問目</span>
            <span id="score">正解数: 0</span>
        </div>
        <button id="next-button" onclick="loadNextQuestion()" style="display: none">次の問題へ</button>
    </div>

    <script>
        //テーマ切り替え
        document.querySelectorAll('input[name="theme"]').forEach((input) => {
            input.addEventListener("change", (e) => {
                const theme = e.target.value;
                document.body.className = theme + "-theme";
            });
        });
    </script>

    <script src="script.js"></script>
    
</body>
</html>
